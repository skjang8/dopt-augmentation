[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dopt-augment"
version = "1.0.0"
description = "Sequential D-optimal augmentation of an existing experimental record"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[tool.setuptools]
packages = ["dopt"]
